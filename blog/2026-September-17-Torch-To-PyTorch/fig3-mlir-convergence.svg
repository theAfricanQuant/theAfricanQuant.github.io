  <text x="165" y="57" text-anchor="middle" font-family="Inter" font-size="12" fill="#57534E">Modular &#183; one language for everything</text>

  <rect x="350" y="16" width="250" height="52" rx="10" fill="#F3F8F4" stroke="#CFE0D4" stroke-width="2"/>
  <text x="475" y="38" text-anchor="middle" font-family="Inter" font-size="15" font-weight="600" fill="#321208">ZML (Zig)</text>
